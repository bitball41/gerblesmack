name: Gatefold Godot Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gatefold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.2 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false
          include-templates: true
      - name: Verify engine
        run: godot --version
      - name: Import and parse Godot project
        run: godot --headless --path . --import
      - name: Runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee godot-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call" godot-smoke.log; then
            exit 1
          fi
      - name: Legacy rules and save regression checks
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script tests/regression.gd 2>&1 | tee regression.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|FAIL:" regression.log; then
            exit 1
          fi
      - name: UI and autoplay smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script tests/ui_smoke.gd 2>&1 | tee ui-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|FAIL:" ui-smoke.log; then
            exit 1
          fi
      - name: Build web version
        shell: bash
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
          python3 tools/prepare_web.py build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
